# OpenSpec project configuration for a Terraform module repository
# (template from the profiles repository, profile terraform-module).
# `context` is injected into every planning artifact; keep it to what is
# specific to THIS module. Engineering standards are not repeated here: they
# are fetched on demand from the referenced stores (quality, repository, terraform) (see the index that
# `openspec instructions` prints). `mise run spec-setup` registers the stores.
schema: spec-driven

# `ref` pins each store to a released tag (openspec-consumption); the setup
# script clones at that tag and reports a registered checkout on another commit.
references:
  - id: quality
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/quality.git
    ref: v1.2.6
  - id: repository
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/repository.git
    ref: v4.1.0
  - id: terraform
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/terraform.git
    ref: v1.2.6

context: |
  Quality mandate: every artifact applies the non-negotiables of AGENTS.md
  (simple, efficient, secure, production-level) and cites the quality-store
  specs that decided something.

  Project: OpenTofu/Terraform module that builds a Scaleway network stack: one
  VPC (routing, custom route propagation, transitivity), private networks
  keyed by name with optional IPv4/IPv6 subnets, an optional public gateway per
  zone (flexible IP, NAT masquerade, SMTP, SSH bastion) attached to every
  private network through IPAM IPs, and an optional VPC access control list.
  Published on GitLab (leminnov/terraform/modules/scaleway-network); consumers
  pin a git tag (?ref=vX.Y.Z). Apache-2.0. OpenSpec was first adopted here by
  the change adopt-openspec; the module had no earlier spec system.

  Stack: HCL only. required_version >= 1.10.7. Providers pinned with ~> in
  versions.tf: scaleway/scaleway ~> 2.86. Every tool is pinned in mise.toml.

  Layout: main.tf holds every resource (named `this`, themed sections: VPC,
  ACL, private networks, gateway IPs, gateways, IPAM IPs, gateway networks);
  locals.tf computes the zone sets and network-zone pairs; data.tf looks up the
  project by name and organization; variables.tf is the whole input contract
  (24 variables); outputs.tf exposes IDs and addresses; examples/minimal and
  examples/complete are the usage examples. There is no tests/ directory yet:
  new behaviour adds tests/main.tftest.hcl (run with `tofu test`).

  Module-specific conventions (the generic ones are standards in the
  quality, repository and terraform stores, fetched on demand): inputs are
  prefixed by theme (vpc_, network_, gateway_, access_control_list_, bastion_,
  enable_ for the optional blocks); gateways and IPAM IPs are keyed by zone or
  "<network>-<zone>"; README tables are generated by terraform-docs;
  CHANGELOG.md is generated by git-cliff from commit subjects (`mise run
  changelog`, .cliff.toml) and is not edited by hand, so each commit subject
  reads as its CHANGELOG line; versions follow semver.

  Commands: tofu fmt -recursive; tofu init -backend=false && tofu validate;
  tflint --recursive; tofu test (once tests/ exists); pre-commit run -a;
  mise run changelog; mise run spec-validate.

  Standards: fetch the referenced-store specs listed in these instructions
  whose id matches the area touched, and cite the ones applied.

rules:
  proposal:
    - Classify the change as semver major/minor/patch per terraform-versioning and list every input or output whose type, default or meaning changes
    - State what lands in state; a new secret-bearing input must follow terraform-security (write-only argument plus *_wo_version) or justify why it cannot
  specs:
    - Write requirements against the module's observable contract (input shape, validation errors, resources produced, outputs, check warnings, empty second plan), not against provider internals
    - Give every validation block and every check block a scenario with the rejected or warned input
    - Reuse the existing capability directories under openspec/specs (module-contract, vpc, private-networks, public-gateways, access-control-list) before creating a new one
  design:
    - Name the resources and arguments used and the provider version that introduced them
    - Explain how the change avoids a perpetual diff and how existing state migrates (moved blocks, in-place update or forced replacement)
    - Keep provider {} and backend {} out of the module and never shell out to a CLI
  tasks:
    - Include unit tests in tests/main.tftest.hcl (none exist yet; the first behaviour change creates the file) and examples/complete plus any example the change affects
    - Include tofu fmt -recursive, tofu validate, tflint --recursive, tofu test and pre-commit run -a (terraform-docs README regeneration)
    - Include a commit subject that reads as its CHANGELOG.md line (git-cliff generates the file; never edit it by hand) with upgrade notes in the commit body for anything breaking, and README updates when the compatibility matrix changes

operations:
  apply:
    guidance:
      - Apply the quality store (simplicity, efficiency, security, production-readiness) to every task; fetch terraform-code-style, terraform-variables and terraform-outputs from the terraform store before editing HCL; flag any deviation with a DEVIATION(<spec-id>) comment
      - Run tofu fmt -recursive, tofu validate and tofu test (when tests/ exists) after each task group and do not mark a task done while they fail
      - Never run tofu apply or init with a backend against a real Scaleway project unless the user asked; say explicitly when it was skipped
      - Report test and scanner output as-is, including failures
  archive:
    guidance:
      - Confirm the commit subject reads as its CHANGELOG line (regenerate CHANGELOG.md with `mise run changelog` at release) and the terraform-docs README block was updated before archiving
      - Summarize which main specs changed and any requirement that was removed
